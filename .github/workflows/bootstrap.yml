name: Bootstrap M7 Client

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrair M7 Client
        run: |
          rm -rf /tmp/m7
          mkdir -p /tmp/m7
          unzip -q M7_Client_v0.1_Source.zip -d /tmp/m7
          cp -a /tmp/m7/M7-Client/. .
          rm -f M7_Client_v0.1_Source.zip

      - name: Publicar código no repositório
        run: |
          git config user.name "M7 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: M7 Client v0.1 Alpha" || true
          git push

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: M7-Client-v0.1-ALPHA
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
